# Dependency-free, same discipline as `fdt`/`cpio`/`videocore`: a virtqueue is a
# structure in memory, and every way of getting it wrong is a layout mistake that
# produces silence rather than an error. The doorbell — the MMIO write that tells
# the device to look — lives in the driver.
